log_format metrics '$remote_addr - $request_length $bytes_sent $request_time';

access_log /var/log/angie/access.log metrics;

# Main vhost - Swagger + API
server {
    listen 82;
    server_name localhost;

    # Links page (index.html mounted from repo root)
    location = / {
        root /usr/share/angie/html;
        index index.html;
    }

    location / {
        proxy_pass http://bank-app:8080;
        proxy_set_header Host $host;
    }

    # API: авторизует запрос через njs (Basic -> кэш JWT -> Keycloak password grant),
    # затем подкладывает Bearer-токен из кэша. Bearer из клиента проходит как есть.
    location /api/ {
        auth_request /_jwt;
        proxy_pass http://bank-app:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $auth_token;
    }

    # Internal njs auth subrequest
    location = /_jwt {
        internal;
        js_content jwt.handle;
    }

    # Internal Keycloak token endpoint proxy (password grant)
    location = /_kc {
        internal;
        proxy_pass http://keycloak:8080/realms/bank/protocol/openid-connect/token;
        proxy_set_header Content-Type application/x-www-form-urlencoded;
    }

    location /swagger-ui.html {
        proxy_pass http://bank-app:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://bank-app:8080/v3/;
        proxy_set_header Host $host;
    }

    # Index page
    location /index.html {
        root /usr/share/angie/html;
        index index.html;
    }

    # Console Light
    location /console.html {
        root /usr/share/angie/html;
        index console.html;
    }

    # Web UI Keycloak (static, mounted ./ui-keycloak -> /usr/share/angie/html/ui-keycloak)
    location = /ui-keycloak {
        return 302 /ui-keycloak/;
    }

    location /ui-keycloak/ {
        root /usr/share/angie/html;
        index index.html;
        try_files $uri $uri/ /ui-keycloak/index.html;
    }

    # Web UI basic (без redirect на Keycloak; Basic -> JWT через njs, mounted ./ui-basic)
    location = /ui-basic {
        return 302 /ui-basic/;
    }

    location /ui-basic/ {
        root /usr/share/angie/html;
        index index.html;
        try_files $uri $uri/ /ui-basic/index.html;
    }

    # Debug: сколько токенов в njs jwt_cache (логины + наличие токена)
    location = /_jwt_stats {
        default_type application/json;
        js_content jwt.stats;
    }

    # Angie stub_status (базовая статистика)
    location /angie_status {
        stub_status on;
        access_log off;
    }

    # Angie API JSON (расширенная статистика)
    location /status/ {
        api /status/;
    }
}