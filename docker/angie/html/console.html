<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angie Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #a855f7; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #94a3b8; margin-bottom: 40px; font-size: 16px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .metric { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: #94a3b8; }
        .metric-value { color: #a855f7; font-weight: bold; font-family: monospace; }
        .refresh { background: #a855f7; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .refresh:hover { background: #9333ea; }
        .error { color: #ef4444; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Angie Console</h1>
        <p class="subtitle">Мониторинг через Angie API</p>
        
        <button class="refresh" onclick="fetchStats()">Обновить</button>
        
        <div class="card" id="stats">
            <div class="metric">
                <span class="metric-label">Загрузка...</span>
                <span class="metric-value">—</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = '<div class="metric"><span class="metric-label">Загрузка...</span><span class="metric-value">—</span></div>';
            
            try {
                const response = await fetch('/status/');
                const data = await response.json();
                
                let html = '';
                
                if (data.connections) {
                    html += `<div class="metric"><span class="metric-label">Active Connections</span><span class="metric-value">${data.connections.active}</span></div>`;
                    html += `<div class="metric"><span class="metric-label">Idle Connections</span><span class="metric-value">${data.connections.idle}</span></div>`;
                    html += `<div class="metric"><span class="metric-label">Accepted</span><span class="metric-value">${data.connections.accepted}</span></div>`;
                    html += `<div class="metric"><span class="metric-label">Dropped</span><span class="metric-value">${data.connections.dropped}</span></div>`;
                }
                
                if (data.requests) {
                    html += `<div class="metric"><span class="metric-label">Total Requests</span><span class="metric-value">${data.requests.total}</span></div>`;
                }
                
                if (data.server_zones) {
                    for (const [zone, stats] of Object.entries(data.server_zones)) {
                        html += `<div class="metric"><span class="metric-label">Zone: ${zone} - Requests</span><span class="metric-value">${stats.requests || 0}</span></div>`;
                    }
                }
                
                if (data.upstreams) {
                    for (const [upstream, stats] of Object.entries(data.upstreams)) {
                        html += `<div class="metric"><span class="metric-label">Upstream: ${upstream}</span><span class="metric-value">${stats.peers?.length || 0} peers</span></div>`;
                        if (stats.peers) {
                            stats.peers.forEach((peer, i) => {
                                html += `<div class="metric"><span class="metric-label" style="padding-left: 20px;">Peer ${i+1}: ${peer.server}</span><span class="metric-value">${peer.state} (${peer.requests})</span></div>`;
                            });
                        }
                    }
                }
                
                if (!html) {
                    html = '<div class="metric"><span class="metric-label">Нет данных</span><span class="metric-value">—</span></div>';
                }
                
                statsDiv.innerHTML = html;
            } catch (error) {
                statsDiv.innerHTML = `<div class="error">Ошибка: ${error.message}</div>`;
            }
        }
        
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
