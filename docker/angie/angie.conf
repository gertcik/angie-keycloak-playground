load_module /usr/lib/angie/modules/ngx_http_js_module.so;

worker_processes auto;
error_log /var/log/angie/error.log warn;
pid /var/run/angie.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

    access_log /var/log/angie/access.log main;

    # njs: Basic -> JWT cache. TTL задаёт таймаут зоны (270 с = exp токена 300 с
    # минус запас 30 с). ВАЖНО: НЕ передавать третий аргумент (timeout) в set() —
    # в этой сборке Angie он трактуется как миллисекунды; без него действует
    # таймаут зоны (проверено: set(...,270) живёт ~0,27 с, set() без timeout >12 с).
    js_import jwt from /etc/angie/js/jwt.js;
    js_shared_dict_zone zone=jwt_cache:1m timeout=270s;
    js_set $auth_token jwt.lookup;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/angie/conf.d/*.conf;
}